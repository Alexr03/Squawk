# Build and push the Squawk images to Docker Hub on every push to master:
#   docker.io/alexr03/squawk             the game (nginx), built for https://squawk.x3.dev
#   docker.io/alexr03/squawk-pocketbase  PocketBase with pocketbase/pb_migrations and pb_hooks
# Both get :latest and :sha-<commit>; fleet-infra's Image Updater follows the digest behind :latest.
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

name: Images

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version's patch number counts commits

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short commit
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push the game
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: docker.io/alexr03/squawk:latest,docker.io/alexr03/squawk:sha-${{ steps.sha.outputs.short }}
          build-args: |
            VITE_POCKETBASE_URL=https://squawk.x3.dev
            GITHUB_SHA=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push PocketBase
        uses: docker/build-push-action@v7
        with:
          context: pocketbase
          platforms: linux/amd64
          push: true
          tags: docker.io/alexr03/squawk-pocketbase:latest,docker.io/alexr03/squawk-pocketbase:sha-${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pocketbase
          cache-to: type=gha,mode=max,scope=pocketbase
