# Static game. Hashed /assets/* (code and data packs) never change; everything else is revalidated so a deploy shows up at once.
server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml application/wasm;
  gzip_min_length 1024;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
